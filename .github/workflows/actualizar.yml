# Rebuilds and publishes the dashboard on GitHub Pages.
# Every 10 minutes it downloads the two Excel matrices from Google Drive (shared "anyone with the link")
# and publishes only when they changed. A push to the dashboard code or a manual run always publishes.
name: Actualizar dashboard

on:
  schedule:
    # Offset from :00, when GitHub's scheduler is busiest and drops or delays runs.
    - cron: '7-59/10 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['dashboard/**', 'assets/**', '.github/workflows/**']

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: dashboard
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Descargar matrices desde Google Drive
        run: |
          mkdir -p /tmp/matrices
          get() {
            curl -fsSL --retry 3 -o "$2" "https://drive.usercontent.google.com/download?id=$1&export=download&confirm=t"
            if [ "$(head -c 2 "$2")" != "PK" ]; then
              echo "::error::No se pudo descargar $3. Revisa que el archivo esté compartido como 'Cualquier persona con el enlace' (lector)."
              exit 1
            fi
          }
          get "$(node -p "require('./dashboard/config.json').procedimientos.fileId")" /tmp/matrices/proc.xlsx "la matriz de procedimientos"
          get "$(node -p "require('./dashboard/config.json').protocolos.fileId")" /tmp/matrices/prot.xlsx "la matriz de protocolos"

      - name: ¿Cambiaron las matrices?
        id: cambio
        run: |
          hash=$(cat /tmp/matrices/proc.xlsx /tmp/matrices/prot.xlsx | sha256sum | cut -d' ' -f1)
          prev=$(node -p "try { require('./estado.json').hash } catch { '' }")
          echo "hash=$hash" >> "$GITHUB_OUTPUT"
          if [ "$hash" != "$prev" ]; then
            echo "datos=nuevos" >> "$GITHUB_OUTPUT"
            echo "fecha=$(TZ=America/Punta_Arenas date +%d.%m.%y)" >> "$GITHUB_OUTPUT"
          else
            echo "datos=iguales" >> "$GITHUB_OUTPUT"
            echo "fecha=$(node -p "require('./estado.json').fecha")" >> "$GITHUB_OUTPUT"
          fi

      - name: Construir la página
        if: steps.cambio.outputs.datos == 'nuevos' || github.event_name != 'schedule'
        run: |
          mkdir -p site
          node dashboard/export-static.mjs --standalone \
            --proc /tmp/matrices/proc.xlsx --prot /tmp/matrices/prot.xlsx \
            --out site/index.html --fecha "${{ steps.cambio.outputs.fecha }}"

      - uses: actions/upload-pages-artifact@v3
        if: steps.cambio.outputs.datos == 'nuevos' || github.event_name != 'schedule'
        with:
          path: site

      - name: Publicar en GitHub Pages
        if: steps.cambio.outputs.datos == 'nuevos' || github.event_name != 'schedule'
        uses: actions/deploy-pages@v4

      # Records what was published. A commit at least every 45 days also keeps GitHub from
      # pausing the 10-minute schedule (it pauses schedules after 60 days without repository activity).
      - name: Guardar estado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "${{ steps.cambio.outputs.datos }}" = "nuevos" ]; then
            printf '{"hash":"%s","fecha":"%s"}\n' "${{ steps.cambio.outputs.hash }}" "${{ steps.cambio.outputs.fecha }}" > estado.json
            git add estado.json
            git commit -m "Matrices actualizadas (${{ steps.cambio.outputs.fecha }})"
            git push
          elif [ $(( $(date +%s) - $(git log -1 --format=%ct) )) -gt $(( 45 * 86400 )) ]; then
            git commit --allow-empty -m "Mantener activa la actualización automática"
            git push
          fi
